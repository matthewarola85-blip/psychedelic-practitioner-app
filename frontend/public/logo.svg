<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#0a0a0f" rx="80"/>
  
  <!-- Benzene ring -->
  <line x1="140" y1="140" x2="175" y2="120" stroke="#8b5cf6" stroke-width="4" stroke-linecap="round"/>
  <line x1="175" y1="120" x2="210" y2="140" stroke="#8b5cf6" stroke-width="4" stroke-linecap="round"/>
  <line x1="210" y1="140" x2="210" y2="180" stroke="#8b5cf6" stroke-width="4" stroke-linecap="round"/>
  <line x1="210" y1="180" x2="175" y2="200" stroke="#8b5cf6" stroke-width="4" stroke-linecap="round"/>
  <line x1="175" y1="200" x2="140" y2="180" stroke="#8b5cf6" stroke-width="4" stroke-linecap="round"/>
  <line x1="140" y1="180" x2="140" y2="140" stroke="#8b5cf6" stroke-width="4" stroke-linecap="round"/>
  <circle cx="175" cy="160" r="16" fill="none" stroke="#6d28d9" stroke-width="2"/>

  <!-- Pyrrole ring -->
  <line x1="210" y1="140" x2="240" y2="125" stroke="#8b5cf6" stroke-width="4" stroke-linecap="round"/>
  <line x1="240" y1="125" x2="262" y2="148" stroke="#8b5cf6" stroke-width="4" stroke-linecap="round"/>
  <line x1="262" y1="148" x2="262" y2="172" stroke="#8b5cf6" stroke-width="4" stroke-linecap="round"/>
  <line x1="262" y1="172" x2="240" y2="195" stroke="#8b5cf6" stroke-width="4" stroke-linecap="round"/>
  <line x1="240" y1="195" x2="210" y2="180" stroke="#8b5cf6" stroke-width="4" stroke-linecap="round"/>

  <!-- NH node -->
  <circle cx="262" cy="160" r="16" fill="#1a0a3d" stroke="#a78bfa" stroke-width="3"/>
  <text x="262" y="165" font-family="-apple-system,sans-serif" font-size="13" font-weight="500" fill="#e8e6f0" text-anchor="middle">NH</text>

  <!-- Ethylamine chain -->
  <line x1="240" y1="125" x2="262" y2="105" stroke="#a78bfa" stroke-width="3" stroke-linecap="round"/>
  <line x1="262" y1="105" x2="292" y2="113" stroke="#a78bfa" stroke-width="3" stroke-linecap="round"/>

  <!-- N,N-dimethyl nitrogen -->
  <circle cx="312" cy="95" r="18" fill="#1a0a3d" stroke="#a78bfa" stroke-width="3"/>
  <text x="312" y="100" font-family="-apple-system,sans-serif" font-size="14" font-weight="500" fill="#e8e6f0" text-anchor="middle">N</text>
  <line x1="292" y1="113" x2="312" y2="95" stroke="#a78bfa" stroke-width="3" stroke-linecap="round"/>

  <!-- Methyl groups -->
  <line x1="312" y1="95" x2="338" y2="78" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="312" y1="95" x2="338" y2="112" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="346" cy="73" r="10" fill="#2d1b69"/>
  <circle cx="346" cy="117" r="10" fill="#2d1b69"/>

  <!-- Key carbon dots -->
  <circle cx="210" cy="140" r="5" fill="#8b5cf6"/>
  <circle cx="210" cy="180" r="5" fill="#8b5cf6"/>
  <circle cx="240" cy="125" r="5" fill="#a78bfa"/>
  <circle cx="262" cy="105" r="5" fill="#a78bfa"/>
  <circle cx="292" cy="113" r="5" fill="#a78bfa"/>

  <!-- Wordmark -->
  <text x="200" y="270" font-family="-apple-system,sans-serif" font-size="52" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="-2">Vessel</text>
  <text x="200" y="300" font-family="-apple-system,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" letter-spacing="4">TREATMENT INTELLIGENCE</text>
</svg>
